[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "renpy-inspector"
version = "0.1.0"
description = "Professional static code analysis and QA inspector for Ren'Py projects"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Ren'Py Inspector Team" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]
gui = [
    "PySide6>=6.6.0",
]

[project.scripts]
renpy-inspector = "renpy_inspector.cli.main:main"
renpy-inspector-gui = "renpy_inspector.gui.app:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
